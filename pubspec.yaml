name: ecommerce_app
description: "Shop by Tehreem - Cosmetics E-commerce App"

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
   

  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^4.1.0
  firebase_auth: ^6.5.4
  cloud_firestore: ^6.0.1
  firebase_storage: ^13.0.1

  # State Management
  provider: ^6.1.5

  # Fonts
  google_fonts: ^6.3.1

  # Images
  image_picker: ^1.2.0
  cached_network_image: ^3.4.1

  # SVG Support
  flutter_svg: ^2.2.0

  # Date & Currency Formatting
  intl: ^0.20.2

  # Loading Indicators
  flutter_spinkit: ^5.2.2

  # Toast Messages
  fluttertoast: ^9.1.0

  # Network
  http: ^1.5.0

  # UUID Generator
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/logo/

  # Uncomment after adding custom fonts
  # fonts:
  #   - family: PlayfairDisplay
  #     fonts:
  #       - asset: assets/fonts/PlayfairDisplay-Regular.ttf
  #
  #   - family: PlusJakartaSans
  #     fonts:
  #       - asset: assets/fonts/PlusJakartaSans-Regular.ttf