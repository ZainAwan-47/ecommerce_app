name: ecommerce_app
description: "Shop by Tehreem - Cosmetics E-commerce App"

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^4.1.0
  firebase_auth: ^6.5.4
  google_sign_in: ^7.1.1
  cloud_firestore: ^6.0.1
  firebase_storage: ^13.0.1
  firebase_messaging: ^16.0.1

  # Notifications
  flutter_local_notifications: ^19.4.2

  # State Management
  provider: ^6.1.5

  # Fonts
  google_fonts: ^6.3.1

  # Images
  image_picker: ^1.2.0
  image_cropper: ^9.1.0
  cached_network_image: ^3.4.1

  # SVG Support
  flutter_svg: ^2.2.0

  # Date & Currency Formatting
  intl: ^0.20.2

  # Loading Indicators
  flutter_spinkit: ^5.2.2

  # Toast Messages
  fluttertoast: ^9.1.0

  # HTTP (Used for EmailJS API)
  http: ^1.5.0

  # UUID Generator
  uuid: ^4.5.1

  # Local Storage
  shared_preferences: ^2.5.3

  # Top Snackbar
  top_snackbar_flutter: ^3.1.0

  # Share Products
  share_plus: ^11.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/google.png
    - assets/logo/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/logo/playstore-icon.png
  min_sdk_android: 21
  adaptive_icon_background: "#000000"